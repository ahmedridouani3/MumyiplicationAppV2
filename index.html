
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les multiplications</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  font-family: Arial, sans-serif;
  background: #f2f7f2;
  text-align: center;
  color: #333;
}

.container {
  max-width: 550px;
  margin: 20px auto;
  padding: 25px;
  background: white;
  border-radius: 18px;
  box-shadow: 0 4px 15px #00000015;
}

h1 {
  color: #4CAF50;
  margin-bottom: 10px;
}

h2 {
  margin: 15px 0;
}

button {
  cursor: pointer;
  border: none;
  border-radius: 10px;
  padding: 12px 18px;
  font-size: 17px;
  font-weight: bold;
  transition: 0.2s;
}

button:disabled {
  cursor: not-allowed;
}

.tables, .levels {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin: 15px 0;
}

.table-btn, .level-btn {
  background: #e8f5e9;
  color: #287b2d;
}

.table-btn.active, .level-btn.active {
  background: #4CAF50;
  color: white;
}

#startBtn, #homeBtn, #resetBtn {
  background: #4CAF50;
  color: white;
  margin: 8px;
}

#resetBtn {
  background: #777;
}

#quiz, #result {
  display: none;
}

.info {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin: 15px 0;
  font-weight: bold;
}

.timer-container {
  width: 100%;
  height: 12px;
  background: #eee;
  border-radius: 10px;
  overflow: hidden;
  margin: 15px 0;
}

#timerBar {
  height: 100%;
  width: 100%;
  background: #4CAF50;
  transition: width 0.2s linear;
}

#question {
  font-size: 32px;
  font-weight: bold;
  margin: 25px 0;
}

.choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 20px;
}

.choice {
  background: #e8f5e9;
  color: #256b2a;
  font-size: 24px;
  min-height: 65px;
}

.choice:hover:not(:disabled) {
  background: #c8e6c9;
}

.choice.correct {
  background: #4CAF50;
  color: white;
}

.choice.wrong {
  background: #e53935;
  color: white;
}

#feedback {
  min-height: 35px;
  font-size: 19px;
  font-weight: bold;
  margin-top: 20px;
}

#result h2 {
  color: #4CAF50;
  font-size: 28px;
}

.result-number {
  font-size: 22px;
  margin: 12px;
}

#mistakes {
  margin-top: 25px;
  text-align: left;
  background: #fff8e1;
  padding: 15px;
  border-radius: 10px;
}

#mistakes h3 {
  text-align: center;
}

.mistake-item {
  padding: 7px;
  border-bottom: 1px solid #eee;
}

@media (max-width: 400px) {
  .container {
    padding: 15px;
  }

  .choice {
    font-size: 21px;
  }

  #question {
    font-size: 27px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div id="home">
    <h1>📚 Les multiplications</h1>
    <p>Choisis une table et un niveau pour commencer.</p>

    <h2>Choisir une table</h2>
    <div class="tables" id="tables"></div>

    <h2>Choisir un niveau</h2>
    <div class="levels">
      <button class="level-btn" data-time="15">Facile</button>
      <button class="level-btn active" data-time="10">Moyen</button>
      <button class="level-btn" data-time="5">Difficile</button>
    </div>

    <button id="startBtn">Commencer</button>

    <div id="mistakes">
      <h3>❌ Mes erreurs</h3>
      <div id="mistakesList">Aucune erreur enregistrée.</div>
      <button id="resetBtn">Effacer les erreurs</button>
    </div>
  </div>

  <div id="quiz">
    <h1>✍️ À toi de jouer !</h1>

    <div class="info">
      <span id="questionNumber">Question 1/10</span>
      <span id="score">Score : 0</span>
    </div>

    <div class="timer-container">
      <div id="timerBar"></div>
    </div>

    <div id="timeText">10 secondes</div>

    <div id="question"></div>

    <div class="choices" id="qcmArea"></div>

    <div id="feedback"></div>
  </div>

  <div id="result">
    <h1>🏆 Résultat</h1>
    <h2 id="finalScore"></h2>
    <div class="result-number" id="correctCount"></div>
    <div class="result-number" id="wrongCount"></div>
    <button id="homeBtn">Retour à l'accueil</button>
  </div>

</div>

<script>
const tablesArea = document.getElementById("tables");
const home = document.getElementById("home");
const quiz = document.getElementById("quiz");
const result = document.getElementById("result");
const questionElement = document.getElementById("question");
const qcmArea = document.getElementById("qcmArea");
const feedback = document.getElementById("feedback");
const timerBar = document.getElementById("timerBar");
const timeText = document.getElementById("timeText");

let selectedTable = 2;
let selectedTime = 10;
let questionIndex = 0;
let score = 0;
let correctCount = 0;
let wrongCount = 0;
let correctAnswer = 0;
let timer = null;
let nextTimer = null;
let remainingTime = 0;
let answering = false;

const TOTAL_QUESTIONS = 10;
const DELAY = 1200;

// Création des boutons des tables
for (let i = 1; i <= 9; i++) {
  const btn = document.createElement("button");
  btn.className = "table-btn";
  btn.textContent = "Table " + i;

  if (i === selectedTable) {
    btn.classList.add("active");
  }

  btn.addEventListener("click", () => {
    selectedTable = i;

    document.querySelectorAll(".table-btn").forEach(b => {
      b.classList.remove("active");
    });

    btn.classList.add("active");
  });

  tablesArea.appendChild(btn);
}

// Choix du niveau
document.querySelectorAll(".level-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    selectedTime = Number(btn.dataset.time);

    document.querySelectorAll(".level-btn").forEach(b => {
      b.classList.remove("active");
    });

    btn.classList.add("active");
  });
});

// Démarrer le quiz
document.getElementById("startBtn").addEventListener("click", startQuiz);

function startQuiz() {
  clearInterval(timer);
  clearTimeout(nextTimer);

  questionIndex = 0;
  score = 0;
  correctCount = 0;
  wrongCount = 0;

  home.style.display = "none";
  result.style.display = "none";
  quiz.style.display = "block";

  showQuestion();
}

// Afficher une question
function showQuestion() {
  if (questionIndex >= TOTAL_QUESTIONS) {
    showResult();
    return;
  }

  answering = false;

  feedback.textContent = "";
  qcmArea.innerHTML = "";

  const number = Math.floor(Math.random() * 10) + 1;
  correctAnswer = selectedTable * number;

  questionElement.textContent =
    selectedTable + " × " + number + " = ?";

  document.getElementById("questionNumber").textContent =
    "Question " + (questionIndex + 1) + "/" + TOTAL_QUESTIONS;

  document.getElementById("score").textContent =
    "Score : " + score;

  createChoices();
  startTimer();
}

// Générer exactement 4 choix
function createChoices() {
  qcmArea.innerHTML = "";

  const choices = new Set();
  choices.add(correctAnswer);

  // Ajouter 3 mauvaises réponses différentes
  while (choices.size < 4) {
    const value = Math.floor(Math.random() * 91) + 1;

    if (value !== correctAnswer) {
      choices.add(value);
    }
  }

  // Mélanger les 4 propositions
  const array = Array.from(choices);

  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }

  array.forEach(value => {
    const btn = document.createElement("button");

    btn.className = "choice";
    btn.textContent = value;

    btn.addEventListener("click", () => {
      checkAnswer(value, btn);
    });

    qcmArea.appendChild(btn);
  });
}

// Démarrer le chronomètre
function startTimer() {
  clearInterval(timer);

  remainingTime = selectedTime;
  updateTimer();

  timer = setInterval(() => {
    remainingTime--;
    updateTimer();

    if (remainingTime <= 0) {
      timeOut();
    }
  }, 1000);
}

function updateTimer() {
  const percentage = (remainingTime / selectedTime) * 100;

  timerBar.style.width = percentage + "%";
  timeText.textContent = remainingTime + " seconde(s)";

  timerBar.style.background =
    remainingTime <= 3 ? "#e53935" : "#4CAF50";
}

// Vérifier la réponse
function checkAnswer(value, clickedButton) {
  if (answering) return;

  answering = true;
  clearInterval(timer);

  const buttons = qcmArea.querySelectorAll(".choice");

  buttons.forEach(btn => {
    btn.disabled = true;

    if (Number(btn.textContent) === correctAnswer) {
      btn.classList.add("correct");
    }
  });

  if (value === correctAnswer) {
    score++;
    correctCount++;

    feedback.textContent = "✅ Bonne réponse !";
    feedback.style.color = "#4CAF50";
  } else {
    wrongCount++;
    clickedButton.classList.add("wrong");

    feedback.textContent =
      "❌ La bonne réponse est " + correctAnswer;

    feedback.style.color = "#e53935";

    saveMistake(
      questionElement.textContent,
      value,
      correctAnswer
    );
  }

  document.getElementById("score").textContent =
    "Score : " + score;

  autoNext();
}

// Temps écoulé
function timeOut() {
  if (answering) return;

  answering = true;
  clearInterval(timer);

  wrongCount++;

  const buttons = qcmArea.querySelectorAll(".choice");

  buttons.forEach(btn => {
    btn.disabled = true;

    if (Number(btn.textContent) === correctAnswer) {
      btn.classList.add("correct");
    }
  });

  feedback.textContent =
    "⏰ Temps écoulé ! Réponse : " + correctAnswer;

  feedback.style.color = "#e53935";

  saveMistake(
    questionElement.textContent,
    "Temps écoulé",
    correctAnswer
  );

  autoNext();
}

// Passage automatique à la question suivante
function autoNext() {
  nextTimer = setTimeout(() => {
    questionIndex++;
    showQuestion();
  }, DELAY);
}

// Enregistrer les erreurs
function saveMistake(question, answer, correct) {
  let mistakes = JSON.parse(
    localStorage.getItem("multiplicationMistakes") || "[]"
  );

  mistakes.unshift({
    question: question,
    answer: answer,
    correct: correct,
    date: new Date().toLocaleDateString("fr-FR")
  });

  mistakes = mistakes.slice(0, 100);

  localStorage.setItem(
    "multiplicationMistakes",
    JSON.stringify(mistakes)
  );
}

// Afficher les erreurs
function displayMistakes() {
  const mistakes = JSON.parse(
    localStorage.getItem("multiplicationMistakes") || "[]"
  );

  const list = document.getElementById("mistakesList");

  if (mistakes.length === 0) {
    list.textContent = "Aucune erreur enregistrée.";
    return;
  }

  list.innerHTML = "";

  mistakes.forEach(item => {
    const div = document.createElement("div");
    div.className = "mistake-item";

    div.textContent =
      item.question +
      " | Ta réponse : " + item.answer +
      " | Bonne réponse : " + item.correct;

    list.appendChild(div);
  });
}

// Effacer les erreurs
document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("Veux-tu vraiment effacer toutes les erreurs ?")) {
    localStorage.removeItem("multiplicationMistakes");
    displayMistakes();
  }
});

// Afficher le résultat final
function showResult() {
  clearInterval(timer);
  clearTimeout(nextTimer);

  quiz.style.display = "none";
  result.style.display = "block";

  document.getElementById("finalScore").textContent =
    score + " / " + TOTAL_QUESTIONS;

  document.getElementById("correctCount").textContent =
    "✅ Réponses correctes : " + correctCount;

  document.getElementById("wrongCount").textContent =
    "❌ Réponses incorrectes : " + wrongCount;
}

// Retour à l'accueil
document.getElementById("homeBtn").addEventListener("click", () => {
  clearInterval(timer);
  clearTimeout(nextTimer);

  result.style.display = "none";
  home.style.display = "block";

  displayMistakes();
});

// Affichage initial des erreurs
displayMistakes();
</script>

</body>
</html>
